# =========================================================================
# Configurazione applicazione — dndsheets backend
# =========================================================================

# --- HTTP ---
# Porta 8080 e' occupata da un altro progetto Docker locale (gs_backend),
# quindi il nostro backend ascolta sulla 8090.
quarkus.http.port=8090
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8081

# --- MongoDB (collegamento al container docker-compose) ---
quarkus.mongodb.connection-string=mongodb://root:root@localhost:27017
quarkus.mongodb.database=dndsheets

# --- Mail (Mailpit in dev — SMTP fake, UI su http://localhost:8025) ---
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.auth-methods=NONE
quarkus.mailer.from=noreply@dndsheets.local
# IMPORTANTE: Quarkus mailer ha "mock=true" come default in dev/test
# (le email vengono loggate ma non inviate). Lo forziamo a false per dev
# cosi' Mailpit le riceve davvero. (Il profilo %test mantiene mock=true.)
%dev.quarkus.mailer.mock=false

# --- JWT (RS256, chiavi in src/main/resources/jwt/) ---
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=dndsheets
smallrye.jwt.sign.key.location=jwt/privateKey.pem
# Durata access token (la usiamo lato codice per costruire il JWT)
app.jwt.issuer=dndsheets
app.jwt.access-token-duration=PT15M
app.jwt.refresh-token-duration=P30D

# --- Configurazione applicativa ---
# URL base del frontend, usato nei link dentro le email (es. verifica email)
app.frontend.base-url=http://localhost:8081
# Durata validita' token di verifica email
app.email-verification.token-duration=PT24H
# Durata validita' token di reset password
app.password-reset.token-duration=PT1H

# --- Tier / monetizzazione ---
# Numero massimo di schede che un utente FREE puo' creare.
# Premium e admin non hanno limiti.
app.free-tier.max-characters=2

# --- Admin bootstrap ---
# Email dell'utente che viene promosso ad ADMIN allo startup se esiste
# nel DB e non lo e' gia'. Idempotente. Property assente = disabilitato.
# Per attivare: app.admin-bootstrap-email=franksisca@gmail.com (o equivalente prod).

# --- Rate limit (in-memory, per IP) ---
# Max richieste/minuto su endpoint auth sensibili. Sopra il limite -> 429 +
# Retry-After. Bucket per (path, ip), refill continuo. Usato dal RateLimitFilter.
app.rate-limit.login.max-per-minute=5
app.rate-limit.forgot-password.max-per-minute=3

# --- OpenAPI / Swagger UI ---
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
# Aggiunge il bottone "Authorize" in Swagger UI con Bearer token
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=BearerAuth

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."it.fsisca.dndsheets".level=DEBUG

# =========================================================================
# Profilo %dev (mvn quarkus:dev)
# =========================================================================
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# =========================================================================
# Profilo %prod (production: jar invocato con -Dquarkus.profile=prod o via
# variabile QUARKUS_PROFILE=prod). Tutti i segreti sono in variabili
# d'ambiente: il backend si rifiuta di partire se le mandatory non sono
# impostate (Mongo / mailer / JWT path). Vedi sezione "Deploy" nel README.
# =========================================================================

# HTTP: ascolta su tutte le interfacce (l'esposizione su 0.0.0.0 e' sicura
# perche' nginx fa da reverse proxy davanti e ufw chiude la 8090).
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=8090

# CORS: solo l'origine ufficiale del frontend. Anche se nginx fa same-origin
# (frontend e /api/ sullo stesso host), teniamo CORS attivo come safety
# nel caso di test diretto dell'API o se il frontend viene servito altrove.
%prod.quarkus.http.cors.origins=${APP_BASE_URL:https://pg.zaknafein.ovh}

# Mongo: connection string obbligatoria, niente fallback (boot fail-fast).
# L'utente dedicato "dndsheets" deve avere ruolo readWrite sul DB.
%prod.quarkus.mongodb.connection-string=${MONGO_URI}
%prod.quarkus.mongodb.database=${MONGO_DATABASE:dndsheets}

# Mailer: default su Resend (3000 mail/mese free). Cambiare host/port se
# si usa OVH Email Pro / SendGrid / Mailgun. La password e' l'API key Resend.
%prod.quarkus.mailer.host=${SMTP_HOST:smtp.resend.com}
%prod.quarkus.mailer.port=${SMTP_PORT:465}
%prod.quarkus.mailer.start-tls=${SMTP_START_TLS:REQUIRED}
%prod.quarkus.mailer.auth-methods=${SMTP_AUTH:PLAIN}
%prod.quarkus.mailer.username=${SMTP_USERNAME}
%prod.quarkus.mailer.password=${SMTP_PASSWORD}
%prod.quarkus.mailer.from=${SMTP_FROM:noreply@pg.zaknafein.ovh}
%prod.quarkus.mailer.mock=false

# JWT: chiavi su filesystem fuori dal jar (montate dal sistema, chmod 600
# all'utente che fa girare il servizio). Generabili con:
#   openssl genrsa -out privateKey.pem 2048
#   openssl rsa -in privateKey.pem -pubout -out publicKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:file:/etc/dndsheets/jwt/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:file:/etc/dndsheets/jwt/privateKey.pem}

# URL base del frontend per i link nelle email (verify-email, reset-password).
# Stesso valore di APP_BASE_URL usato per CORS.
%prod.app.frontend.base-url=${APP_BASE_URL:https://pg.zaknafein.ovh}

# Bootstrap admin: email da promuovere ad ADMIN allo startup (idempotente).
# Tipicamente la tua email da proprietario. Lasciare ADMIN_BOOTSTRAP_EMAIL
# non settata per disabilitare (default vuoto -> Optional.empty nel codice).
%prod.app.admin-bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}

# Log JSON-compatibile e livello INFO in prod.
%prod.quarkus.log.level=INFO
%prod.quarkus.log.category."it.fsisca.dndsheets".level=INFO
%prod.quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# =========================================================================
# Profilo %test
# =========================================================================
# Niente connection-string: Quarkus Dev Services avvia un container Mongo
# effimero via Testcontainers per ogni esecuzione dei test (richiede Docker).
%test.quarkus.mongodb.database=dndsheets-test
# Mailer mockato: niente SMTP reale, le email finiscono in MockMailbox
# (iniettabile nei test).
%test.quarkus.mailer.mock=true
# Porta HTTP dei test diversa dalla 8081 (usata dal frontend Flutter).
quarkus.http.test-port=8092
# In test default il limite scheda free e' "praticamente infinito" cosi' i test
# storici (che creano molte schede) non rompono. I test specifici del limite
# usano un @TestProfile che lo riporta a 2.
%test.app.free-tier.max-characters=999
# Stesso pattern per il rate limit: alto in test default, abbassato dai test
# specifici via @TestProfile.
%test.app.rate-limit.login.max-per-minute=10000
%test.app.rate-limit.forgot-password.max-per-minute=10000
