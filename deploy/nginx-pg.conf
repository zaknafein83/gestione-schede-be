# Template vhost nginx per pg.zaknafein.ovh — pattern "split":
#   - SPA statica (Flutter Web build) da /var/www/pg/
#   - API Quarkus proxata da /api/* → 127.0.0.1:8082 (backend container)
#
# Da installare in /etc/nginx/sites-available/pg.conf e linkare in
# sites-enabled/. NON usare `new-subdomain.sh` per questo (lo script genera
# il template proxy-only, qui ci serve split).
#
# Setup:
#   1. Crea cartella web:
#        sudo install -d -o deploy -g www-data -m 755 /var/www/pg
#        echo "<h1>Coming soon</h1>" | sudo tee /var/www/pg/index.html >/dev/null
#   2. Copia questo file + lo snippet dei security header:
#        sudo cp deploy/nginx-pg.conf /etc/nginx/sites-available/pg.conf
#        sudo ln -s ../sites-available/pg.conf /etc/nginx/sites-enabled/pg.conf
#        sudo install -d /etc/nginx/snippets
#        sudo cp deploy/pg-security-headers.conf /etc/nginx/snippets/pg-security-headers.conf
#      (lo snippet e' incluso sia nel blocco server che nel location asset.)
#   3. Cert Let's Encrypt:
#        sudo certbot certonly --nginx -d pg.zaknafein.ovh \
#          -m franksisca@gmail.com --agree-tos --non-interactive
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Aggiorna /opt/.ports-registry:
#        echo "8082  gestione-schede   pg.zaknafein.ovh" | sudo tee -a /opt/.ports-registry

server {
    listen 80;
    server_name pg.zaknafein.ovh;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pg.zaknafein.ovh;

    ssl_certificate     /etc/letsencrypt/live/pg.zaknafein.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pg.zaknafein.ovh/privkey.pem;

    # Security headers di base + CSP. ATTENZIONE: nginx NON eredita gli
    # add_header dei blocchi superiori dentro un `location` che ne dichiara
    # di propri — vanno quindi ri-dichiarati in OGNI location con add_header
    # (vedi gli asset statici sotto, altrimenti uscirebbero senza header).
    # Per evitare la duplicazione li teniamo in un file include condiviso.
    include /etc/nginx/snippets/pg-security-headers.conf;

    # Upload portrait/avatar via GridFS — alza il limite di body.
    client_max_body_size 10M;

    root /var/www/pg;
    index index.html;

    # Backend Quarkus su /api/* (rimuovendo il prefisso /api dalla request
    # interna — slash finale dopo la porta).
    location /api/ {
        proxy_pass         http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Asset statici: cache aggressiva (i nomi Flutter Web hanno hash).
    # `expires 7d` emette gia' Cache-Control: max-age=604800, quindi NON
    # aggiungiamo un secondo Cache-Control. Ri-includiamo i security header
    # perche' questo location ha un suo add_header (expires) e altrimenti
    # perderebbe HSTS/nosniff/X-Frame-Options/Referrer-Policy/CSP.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        include /etc/nginx/snippets/pg-security-headers.conf;
    }

    # SPA fallback: tutto ciò che non matcha un file reale → index.html.
    location / {
        try_files $uri /index.html;
    }
}
