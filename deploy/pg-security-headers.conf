# Security header condivisi per pg.zaknafein.ovh.
# Da installare in /etc/nginx/snippets/pg-security-headers.conf e incluso
# (con `include`) sia nel blocco server che in ogni location che dichiara
# un proprio add_header (es. asset statici con `expires`), perche' nginx NON
# eredita gli add_header dei livelli superiori quando un location ne ha di suoi.
#
# NB: con `add_header ... always` l'header viene emesso anche sulle risposte
# di errore (4xx/5xx).
#
# La Content-Security-Policy e' tarata sulle dipendenze runtime dell'app:
#   - Flutter Web (CanvasKit/WASM): 'wasm-unsafe-eval', canvaskit da gstatic,
#     web worker via blob:.
#   - Google Identity Services: accounts.google.com (script/connect/frame).
#   - Paddle.js + checkout overlay: cdn.paddle.com (script) e *.paddle.com
#     (connect/frame), inclusi i domini sandbox.
# Lo script inline di checkout.html e' stato estratto in checkout.js esterno
# apposta per non dover concedere script-src 'unsafe-inline'.
#
# IN CASO DI REGRESSIONE (app che non carica): rinominare temporaneamente
# l'header in "Content-Security-Policy-Report-Only", ricaricare nginx,
# aprire l'app e leggere le violazioni nella console del browser, poi
# correggere le sorgenti mancanti e ripristinare l'header enforcing.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"  always;
add_header X-Frame-Options           "DENY"     always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://www.gstatic.com https://cdn.paddle.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://accounts.google.com https://www.gstatic.com https://*.paddle.com; frame-src https://accounts.google.com https://*.paddle.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
