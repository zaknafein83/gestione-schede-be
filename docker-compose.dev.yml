services:
  mongo:
    image: mongo:8
    container_name: dndsheets-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: dndsheets
    volumes:
      - mongo-data:/data/db

  mailpit:
    # Mailpit: server SMTP fake con UI web per ispezionare le email in dev.
    # Successore moderno di MailHog. SMTP: 1025 | UI: http://localhost:8025
    image: axllent/mailpit:latest
    container_name: dndsheets-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo-data:
